name: build

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Theos
        run: |
          set -e
          export THEOS="$HOME/theos"
          git clone --recursive https://github.com/theos/theos.git "$THEOS"
          curl -L -o sdks.zip https://github.com/theos/sdks/archive/master.zip
          unzip -q sdks.zip
          mkdir -p "$THEOS/sdks"
          cp -R sdks-master/iPhoneOS*.sdk "$THEOS/sdks/" || true
          echo "THEOS=$THEOS" >> "$GITHUB_ENV"

      - name: Install ldid & dpkg
        run: |
          brew install ldid dpkg || true

      - name: Build Rootless DEB Package
        run: |
          set -e
          export PATH="$THEOS/bin:$PATH"
          make clean || true
          make package FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=rootless messages=yes

      - name: Prepare Artifacts
        run: |
          mkdir -p dist
          # Copy .deb packages
          cp packages/*.deb dist/ 2>/dev/null || true
          # Find REAL MH_DYLIB from staged directory (exclude dSYM debug symbols)
          find .theos/_ -name '*.dylib' -not -path '*.dSYM*' -exec cp {} dist/ \;
          cp MobiArmyMod.plist dist/ 2>/dev/null || true
          echo "=== DIST FILES ==="
          ls -la dist/
          file dist/*

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: MobiArmyMod-Release
          path: dist/*
          if-no-files-found: error
